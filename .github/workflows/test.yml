name: test

on:
  push:
  pull_request:

jobs:
  test:
    # 测试用 taskkill 收进程树（测试里进程树断言依赖它），Ubuntu runner 上会红。
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # eslint 与 c8 在 devDependencies 里；测试本身不 import 运行时依赖，
      # 但 npm install 会按 package.json 把 dsh-router-laya 一起装上。
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # 覆盖率门槛写在 .c8rc.json：行覆盖 85%。
      - run: npm run test:coverage
