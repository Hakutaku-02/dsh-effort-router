name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 不跑 install：测试都不 import 运行时依赖 dsh-router-laya，
      # 镜像与部署用的是临时目录里造的假包。
      - run: npm test
