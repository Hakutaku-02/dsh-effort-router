    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#3B82F6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
