  <text x="72" y="230" font-family='system-ui, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="28" fill="#98A6B5">&#25353;&#38590;&#24230;&#33258;&#21160;&#35843;&#24605;&#32771;&#24378;&#24230;</text>

